version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production:
        dependency-type: production
      development:
        dependency-type: development
    ignore:
      # @react-three/postprocessing peers three < 0.185; hold three (and its types) on
      # 0.184.x until postprocessing supports 0.185+, otherwise the bump reintroduces a
      # peer mismatch on the hero's effectcomposer/bloom.
      - dependency-name: "three"
        versions: [">=0.185.0"]
      - dependency-name: "@types/three"
        versions: [">=0.185.0"]
      # eslint-config-next's bundled eslint-plugin-react crashes under eslint 10;
      # hold eslint on 9.x until a next release supports it.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
